[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-mcp"
version = "0.1.0"
description = "DatumBridge MCP server that creates, reads, and edits Word, Excel, and PowerPoint attachments."
readme = "README.md"
requires-python = ">=3.11"
# Direct dependencies are pinned. mcp stays on 1.x: 2.x renamed FastMCP to MCPServer.
dependencies = [
    "mcp==1.30.0",
    "pydantic==2.14.1",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "pillow==12.3.0",
    "defusedxml==0.7.1",  # openpyxl uses it automatically when installed
    "httpx==0.28.1",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Long string literals: authored guide text and raw OOXML fixture parts.
"scripts/generate_registry_docs.py" = ["E501"]
"scripts/make_fixtures.py" = ["E501"]
